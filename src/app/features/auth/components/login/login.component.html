<main class="auth-page d-flex align-items-center justify-content-center min-vh-100 px-3">
  <div class="auth-card card border rounded-4 p-4 p-md-5">
    <div class="text-center mb-4">
      <div
        class="brand-badge rounded-3 d-flex align-items-center justify-content-center fw-bold text-white mx-auto mb-3"
        aria-hidden="true"
      >
        T
      </div>
      <h1 class="h4 fw-bold mb-1">Welcome back</h1>
      <p class="text-muted small mb-0">Log in to Task Manager</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="alert alert-danger py-2 small" role="alert">{{ errorMessage() }}</div>
      }

      <div class="mb-3">
        <label class="form-label fw-semibold small" for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="username"
          required
        />
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold small" for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">Log In</button>
    </form>

    <p class="text-center small text-muted mt-4 mb-0">
      Don't have an account?
      <button type="button" class="btn btn-link p-0 align-baseline" (click)="switchToRegister.emit()">
        Register
      </button>
      — takes 10 seconds, no email verification needed.
    </p>
  </div>
</main>
